[build]
  publish = "."
  functions = "netlify/functions"
  # The ONLY build step this repo has, and it exists for one reason: without it the
  # Neon driver never reaches production.
  #
  # There is no root package.json by design, so Netlify ran no install at all. The
  # dependency in netlify/functions/package.json was therefore never installed on the
  # build machine, and netlify/functions/node_modules is gitignored so it never
  # shipped either. It existed only on developer machines. Production failed with
  #   Cannot find package '@neondatabase/serverless' imported from
  #   /var/task/netlify/functions/airtable.js
  # and every Neon read silently fell back to Airtable — including the step-4b shadow
  # read, which reported ok:false for three days while being recorded as verified.
  #
  # Keep this in sync with netlify/functions/package.json. If a function ever needs a
  # new dependency, adding it there is not enough on its own.
  command = "npm install --prefix netlify/functions --omit=dev"

# The Neon driver is loaded through a DYNAMIC import in _neon.js (kept lazy so
# `node tests/handlers.test.mjs` runs offline with no node_modules). The bundler does
# not trace that into the airtable function's dependency graph, so on production the
# import threw and every Neon read fell back to Airtable — hoursByJob quietly kept
# costing ~16 s while looking like it had succeeded.
#
# Marking the package external tells the bundler not to inline it and to ship it in
# node_modules instead, which is what a runtime dynamic import actually needs. The
# dependency itself is declared in netlify/functions/package.json.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless"]

# QB Time -> Neon incremental pull. Hourly, not Make's nightly 9pm cadence: a pull is
# cheap, and the nightly batch only existed because Make bills per operation.
# Runs in PARALLEL with Make scenario 4546051 during the migration — Make keeps
# writing Airtable, this writes Neon, and the check-only ETL reconciles the two.
[functions."qb-time-pull"]
  schedule = "@hourly"

# ── DENY RULES — keep these FIRST. Netlify matches redirects in order. ───────
#
# ⚠⚠ `publish = "."` publishes the REPO ROOT, so every tracked file is served as
# a static asset on the live site. That is not a theoretical exposure: measured
# on production 2026-08-20, all of these returned 200 to an unauthenticated
# request —
#
#   netlify/functions/_auth.js      the whole token scheme
#   netlify/functions/airtable.js   every handler, the authz policy, every field id
#   netlify/functions/inventory.js  ditto
#   db/schema/*.sql                 the entire database design
#   docs/ROADMAP.md, TODO.md, PLAN-*, AUDIT-*
#   tools/*, tests/SMOKE.md, CLAUDE.md
#
# `.gitignore` already says "Keep internal docs and scratch files out", but a
# gitignore can only catch files one at a time and costs you the file in the
# repo. Only three were ever listed, so everything added since has shipped
# public by default. Blocking by ROUTE fixes the whole class at once and keeps
# every file tracked where it belongs.
#
# Secrets were never exposed: `.env` is gitignored so it is not in the published
# tree, and Netlify does not serve dotfiles at all (`.env.example`, `.gitignore`
# both 404 despite being tracked). `AUTH_SECRET` lives only in the environment,
# so tokens were never forgeable from the published source.
#
# What must stay public is only the app itself: `/`, `/inventory`, `sw.js`, the
# two manifests and `assets/`. Everything below is not that.
#
# ⚠ `/netlify/*` is NOT `/.netlify/*`. The leading dot is Netlify's own function
# namespace and must keep working — the `/api/*` rule below rewrites onto it.
# Verified after deploying this: `/api/inventory` still answers 401, not 404.
#
# ⚠⚠ `force = true` IS THE WHOLE RULE. Without it these do nothing at all.
# Netlify applies a redirect only when the path does NOT match a file in the
# publish directory — and every path here matches a real file, which is the
# entire reason it needed blocking. The first version of this shipped without
# `force` and changed precisely nothing: `_auth.js` still answered 200 after the
# deploy went green. A deploy succeeding is not the same as a rule working, and
# the only way to tell them apart is to re-request the URL afterwards.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/db/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# ── App routes ───────────────────────────────────────────────────────────────
[[redirects]]
  from = "/materials*"
  to = "/inventory"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
